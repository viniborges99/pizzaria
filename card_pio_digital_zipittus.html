<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio Digital · Zipittus Pizzaria Forno à Lenha</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <img src="img/pizza.png" alt="Fundo Pizzaria" class="bg-pizza-img">
  <div class="plate">
    <img src="img/logo.png" alt="Logo da Pizzaria" class="logo-svg" >
    <span class="badge-tag">🔥 FORNO À LENHA</span>
    <p class="info" id="info">Molho de tomate artesanal, orégano e azeitonas pretas</p>
    <div class="sub-info">💡 P = R$ 5,00 a menos | M = R$ 2,00 a menos (em relação à Grande)</div>
  </div>
</header>

<nav id="nav" aria-label="Categorias"></nav>

<main id="main-content">
  <div class="search-box">
    <input type="text" id="search" placeholder="🔍 Buscar pizza, ingrediente ou código (ex: 001, Nutella...)" oninput="filterItems()">
  </div>
  <div id="menu"></div>
</main>

<div class="bar" id="bar">
  <button id="abrir">
    <span id="qtd">Ver pedido (0)</span>
    <span id="sub">R$ 0,00</span>
  </button>
</div>

<div class="veil" id="veil">
  <div class="sheet" role="dialog" aria-label="Seu pedido">
   <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
      <h2 style="margin: 0;">📋 Seu Pedido</h2>
      <button onclick="Object.keys(cart).forEach(k => delete cart[k]); updateCart(); document.getElementById('veil').classList.remove('show');" style="background: none; border: none; font-size: 1.8rem; font-weight: 900; color: var(--red); cursor: pointer; padding: 0 4px; line-height: 1;" aria-label="Limpar e Fechar">&times;</button>
    </div>
    
    <div id="lista"></div>

    <!-- SELEÇÃO DE ENTREGA OU RETIRADA -->
    <div style="margin: 12px 0;">
      <label style="font-size: 0.85rem; font-weight: 800; color: var(--ink); display: block; margin-bottom: 4px;">🛵 Forma de Recebimento:</label>
      <select id="tipo-entrega" onchange="alternarTipoEntrega()" style="width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px; font: 600 0.9rem 'Nunito', sans-serif; background: #fff; outline: none; margin-bottom: 8px;">
        <option value="entrega" selected>🛵 Entrega em Domicílio</option>
        <option value="retirada">🏪 Retirada no Balcão (Sem Taxa)</option>
      </select>

      <!-- LISTA DE BAIRROS -->
      <div id="box-bairro">
        <label style="font-size: 0.85rem; font-weight: 800; color: var(--ink); display: block; margin-bottom: 4px;">📍 Selecione seu Bairro:</label>
        <select id="select-bairro" onchange="atualizarTaxaPorBairro()" style="width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px; font: 600 0.9rem 'Nunito', sans-serif; background: #fff; outline: none;">
          <!-- Preenchido via JS -->
        </select>
      </div>
    </div>

    <div class="total">
      <span>Total</span>
      <span id="total">R$ 0,00</span>
    </div>

    <input id="cli" placeholder="Seu Nome Completo" autocomplete="name">
    <input id="end" placeholder="Rua, Número e Complemento" autocomplete="street-address">
    <input id="obs" placeholder="Observações (ex: sem cebola, entregar no portão)">
    <button class="send" id="enviar"><span>📲 Enviar Pedido via WhatsApp</span></button>
    <button class="close" id="fechar">← Continuar escolhendo</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
